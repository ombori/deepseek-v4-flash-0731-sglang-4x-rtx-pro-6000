# Build the recipe image and push it to ghcr.io.
#
# RUNNER REQUIREMENT: the image is ~46 GB uncompressed (~15 GB pushed), so
# GitHub-hosted runners (~14 GB free disk) CANNOT build it. Point this at a
# self-hosted runner with ~100 GB free disk and Docker. No GPU is needed to
# build — only to serve. The `runner` input selects the runs-on label
# (default: self-hosted).
name: build-image

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "runs-on label of the build machine (needs ~100 GB free disk)"
        default: self-hosted
        required: false
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ${{ inputs.runner || 'self-hosted' }}
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: docker build -t "$IMAGE:sha-${GITHUB_SHA::7}" .

      - name: Tag and push (sha + date + latest)
        run: |
          DATE=$(date -u +%Y-%m-%d)
          docker tag "$IMAGE:sha-${GITHUB_SHA::7}" "$IMAGE:$DATE"
          docker tag "$IMAGE:sha-${GITHUB_SHA::7}" "$IMAGE:latest"
          docker push "$IMAGE:sha-${GITHUB_SHA::7}"
          docker push "$IMAGE:$DATE"
          docker push "$IMAGE:latest"
